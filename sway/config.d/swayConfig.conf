# TOUCHPAD SETTINGS TO 
# 	DISABLE WHILE TYPING
# 	ENABLE TAP TO CLICK
# 	MAP TO LEFT RIGHT AND MIDDLE CLICK FOR 1, 2 AND 3 FINGERS RESPECTIVELY
# 	ENABLE NATURAL SCROLLING
input "type:touchpad" {
    dwt enabled
    dwtp enabled
    tap enabled
    tap_button_map lrm
    natural_scroll enabled
}


#****************************
#                           #
#       KEYBINDINGS         #
#                           #
#****************************
# KEYBIND TO CHANGE WORKSPACE
bindsym Mod1+l workspace next
bindsym Mod1+h workspace prev

#bindsym Mod1+Tab fullscreen disable, focus next sibling, fullscreen enable
#bindsym Mod1+Shift+Tab fullscreen disable, focus prev sibling, fullscreen disable

# Open Thunar file manager
bindsym $mod+Mod1+f exec thunar

# Open Firefox
bindsym $mod+Mod1+b exec firefox

# KEYBIND TO TOGGLE WAYBAR
bindsym $mod+o exec killall -SIGUSR1 waybar

# ALT + SPACE FOR ROFI (fixed: added -modes combi)
bindsym Mod1+space exec rofi -show combi -modes combi -combi-modes "drun,run"

# POWER MENU BINDING
bindsym $mod+Shift+e exec /home/sol/.config/sway/powermenu.sh

# Switch between windows on current workspace
# bindsym Mod1+Tab focus next sibling
# bindsym Mod1+Shift+Tab focus prev sibling

# CONTROL MUSIC PLAYBACK
bindsym $mod+period          exec playerctl next
bindsym $mod+comma           exec playerctl previous
bindsym $mod+slash           exec playerctl play-pause

# Toggle screen
bindsym $mod+Shift+d exec swaymsg "output * dpms toggle"

# MAP CAPSLOCK TO ESC AND SHIFT+CAPSLOCK TO TOGGLE CAPSLOCK
input * xkb_options caps:escape_shifted_capslock

# Toggle foot scratchpad terminal (uses helper script)
bindsym $mod+t exec /home/sol/.config/sway/scratch_term.sh

# Quick jump to Logseq workspace
bindsym $mod+n workspace 3


#****************************
#                           #
#       APPEARANCE          #
#                           #
#***************************#
# DISABLE BORDERS FOR TILES AND FLOATING WINDOWS
default_border none
default_floating_border none
gaps inner 7
gaps outer 4

# The "Smart" Logic
smart_gaps on
smart_borders on

# AUTOHIDE THE WAYBAR: // NOT WORKING TILL NOW.
#bar {
#    swaybar_command waybar
#    position top
#    hidden_state hide
#    mode hide
#    modifier Mod4
#}


#********************************
#                               *
#       DISPLAY SETTINGS        *
#                               *
#********************************

# SET WALLPAPER
output eDP-1 bg /home/sol/Pictures/girl.jpg fill

# SET SCALING OF DISPLAY
output eDP-1 resolution 1920x1080@60Hz
output eDP-1 scale 1.50
output eDP-1 subpixel rgb
output eDP-1 scale_filter smart
output eDP-1 render_bit_depth 10
output eDP-1 color_profile icc "/home/sol/.local/share/icc/display_profile.icm"

# SET FONT OF THE DISPLAY
font pango:JetBrainsMonoNerdFont-Regular 12


#************************************
#                                   #
#       LAUNCH APPS ON STARTUP      #
#                                   #
#***********************************#

# ASSIGN APPS TO SPECIFIC WORKSPACES
# WS1 → Kitty + VSCodium (code workspace, side by side)
assign [app_id="kitty"]    → workspace 1
# NOTE: VSCodium app_id is "codium" on Wayland. Verify with:
#       swaymsg -t get_tree | grep -i codium
#       If it shows "VSCodium" instead, update the line below.
assign [app_id="codium"]   → workspace 1

# WS2 → Firefox
assign [app_id="firefox"]  → workspace 2

# WS3 → Logseq
# NOTE: verify Logseq app_id with: swaymsg -t get_tree | grep -i logseq
# Update "Logseq" below if the real app_id differs
assign [app_id="Logseq"]   → workspace 3

# WS4 → Thunar
assign [app_id="thunar"]   → workspace 4

# WS5 → Spotify
assign [app_id="spotify"]  → workspace 5

# Default layout for WS1: VSCodium (left, larger) + Kitty (right, smaller)
workspace 1 layout splith

# STARTUP EXEC
# WS1: launch Kitty terminals via your existing script, then VSCodium
exec kitty
exec codium

# WS2: Firefox
exec firefox

# WS3: Logseq — delayed so the for_window rule fires before the window appears
exec sleep 2 && ~/AppImages/Logseq-linux-x64-0.10.15.AppImage

# WS4: Thunar
exec thunar

# Scratchpad: foot terminal (hidden until $mod+t)
exec foot --app-id=foot-scratch


# FOR_WINDOW RULES

# Foot scratchpad terminal → floating, centered, sent to scratchpad
for_window [app_id="foot-scratch"] floating enable, \
    resize set 62ppt 48ppt, \
    move position center, \
    move scratchpad

#for_window [app_id="spotify"] move scratchpad


#********************************************
#                                           *
#   GESTURE BINDING TO SPECIFIC ACTIONS     *
#                                           *
#********************************************
# 3-finger swipe right → go to previous workspace
bindgesture swipe:3:right workspace prev

# 3-finger swipe left → go to next workspace
bindgesture swipe:3:left workspace next

# 4-finger tap → Play/Pause
bindgesture hold:4 exec playerctl play-pause

# 4-finger swipe left → Next track
bindgesture swipe:4:left exec playerctl next

# 4-finger swipe right → Previous track
bindgesture swipe:4:right exec playerctl previous

# 3-finger swipe up → Show scratchpad
bindgesture swipe:3:up exec swaymsg scratchpad show

# 3-finger swipe down → move focused window to scratchpad
bindgesture swipe:3:down exec swaymsg move scratchpad

# SET 4 FINGER SWIPE UP/DOWN FOR INCREASING/DECREASING VOLUME
bindgesture swipe:4:up exec pactl set-sink-volume @DEFAULT_SINK@ +5%
bindgesture swipe:4:down exec pactl set-sink-volume @DEFAULT_SINK@ -5%

# SET 3 FINGER PINCH INWARD TO LAUNCH ROFI
bindgesture pinch:3:inward exec rofi -show drun

# SET 4 FINGER PINCH OUTWARD TO TOGGLE FULLSCREEN
bindgesture pinch:4:outward fullscreen toggle

#**********************************************
#
#   SETS THE DEFAULT THEME TO GRUVBOX FOR GTK APPS
#
#************************************************
set $gnome-schema org.gnome.desktop.interface

exec_always {
    gsettings set $gnome-schema gtk-theme     'Gruvbox-Dark'
    gsettings set $gnome-schema color-scheme  'prefer-dark'
    gsettings set $gnome-schema icon-theme    'Gruvbox-Plus-Dark'   # optional, see below
    gsettings set $gnome-schema cursor-theme  'Adwaita'
}

#******************************************
#
#   Clipboard history
#
#******************************************
# Start clipboard daemon on launch
exec wl-paste --watch cliphist store
# Open clipboard history picker
bindsym $mod+C exec cliphist list | rofi -dmenu | cliphist decode | wl-copy

# WORKAROUND TO REMOVE THE TITLE BARS IN TABBED AND CASCADE LAYOUT
font pango:monospace 1
titlebar_padding 1 1
titlebar_border_thickness 0
